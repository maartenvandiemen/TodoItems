on:
  workflow_call:
    outputs:
      instanceId:
        description: Random id that makes this instance unique
        value: ${{ jobs.determine_names.outputs.instanceId }}
      resourceGroupPrefix:
        description: Unique name of this instance. main.bicep names the resource group <prefix>-app.
        value: ${{ jobs.determine_names.outputs.resourceGroupPrefix }}

defaults:
  run:
    shell: pwsh

jobs:
  # Separate job for generating the name. When a later job fails and only the failed jobs are
  # re-run, the same name (and therefore the same resource groups) is used again.
  determine_names:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      instanceId: ${{ steps.names.outputs.instanceId }}
      resourceGroupPrefix: ${{ steps.names.outputs.resourceGroupPrefix }}
    steps:
      - name: Determine names
        id: names
        run: |
          $instanceId = Get-Random -Minimum 10000000000 -Maximum 99999999999
          echo "instanceId=$instanceId" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "resourceGroupPrefix=todoItems-$instanceId" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
