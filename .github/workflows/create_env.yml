on:
  workflow_call:
    inputs:
      region:
        type: string
        required: true
        description: Azure region where the resources should be deployed
      template:
        type: string
        required: true
        description: Location of the orchestrator (main.bicep), relative to the workspace
      hubResourceGroup:
        type: string
        required: true
        description: Name of the resource group of the hub. Created by the template.
      spokesResourceGroup:
        type: string
        required: true
        description: Name of the resource group of the spokes and the web app. Created by the template.
      additionalParameters:
        type: string
        required: false
        description: "Additional parameters for the BICEP template, as YAML (key: value per line)"
    outputs:
      webAppName:
        description: "Created webApp"
        value: ${{jobs.create_env.outputs.webAppName}}
      sqlServerFQDN:
         description: Fully Qualified DomainName of the created Azure SQL Server
         value: ${{jobs.create_env.outputs.sqlServerFQDN}}
      databaseName:
         description: Created database
         value: ${{jobs.create_env.outputs.databaseName}}
      webAppUrl:
        description: "Created webApp url. The web app is private, use gatewayUrl to reach it."
        value: ${{jobs.create_env.outputs.webAppUrl}}
      gatewayUrl:
        description: "Url of the Application Gateway in front of the webApp"
        value: ${{jobs.create_env.outputs.gatewayUrl}}

defaults:
  run:
    shell: pwsh
jobs:
  create_env:
    permissions:
      id-token: write
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    outputs:
      webAppUrl: ${{ steps.arm.outputs.webAppUrl }}
      webAppName: ${{ steps.arm.outputs.webAppName }}
      gatewayUrl: ${{ steps.arm.outputs.gatewayUrl }}
      sqlServerFQDN: ${{ steps.arm.outputs.sqlServerFQDN }}
      databaseName: ${{ steps.arm.outputs.databaseName }}
    environment: AzureDeploy
    steps:
      - name: Download a bicep templates
        uses: actions/download-artifact@v8
        with:
          name: infraCode
          path: ${{github.workspace}}/artifacts/bicep

      - name: Azure login
        uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The template runs at subscription scope and creates the resource groups itself.
      - name: Deploy Azure infrastructure
        uses: azure/bicep-deploy@v2
        id: arm
        with:
          type: deployment
          operation: create
          scope: subscription
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          location: ${{ inputs.region }}
          template-file: ${{github.workspace}}${{ inputs.template }}
          parameters: |
            location: ${{ inputs.region }}
            hubResourceGroupName: ${{ inputs.hubResourceGroup }}
            spokesResourceGroupName: ${{ inputs.spokesResourceGroup }}
            ${{ inputs.additionalParameters }}
            sqlAdministratorLoginPassword: ${{ secrets.SA_PASSWORD }}
            sqlAdministratorLoginUser: ${{ secrets.AZURE_SQL_USER }}
