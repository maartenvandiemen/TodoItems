name: Build TodoItems Docker
on: 
  schedule:
    - cron:  '0 0 * * 3'
  push:
    paths-ignore:
      - .azuredevops/**
      - .devcontainer/**
      - .vscode/**
      - .github/dependabot.yml
  workflow_dispatch:
    inputs:
      buildConfiguration:
        description: 'Build configuration'
        required: true
        default: 'Release' 
        type: choice
        options:
        - Debug
        - Release
      keepEnvironment:
        description: 'Keep the Azure resources after the run, also when it fails (for debugging)'
        required: true
        default: false
        type: boolean

defaults:
  run:
    shell: pwsh
jobs:
  determine_variables:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      buildConfiguration: ${{ steps.setupVars.outputs.buildConfiguration }}
      pushImage: ${{ steps.setupVars.outputs.pushImage }}
    steps:
    - run: echo '${{inputs.buildConfiguration}}'
    - name: Setup variables
      id: setupVars
      run: |
        if("${{inputs.buildConfiguration}}"){
          echo "buildConfiguration=${{inputs.buildConfiguration}}" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
        }
        else{
          echo "buildConfiguration=Release" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
        }
  
  build:
    needs: [determine_variables]
    uses: ./.github/workflows/build.yml
    with:
      buildConfiguration: ${{needs.determine_variables.outputs.buildConfiguration}}
    secrets: inherit

  determine_names:
    uses: ./.github/workflows/determine_names.yml

  dockerfile_artifact:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dockerFile
          path: ${{github.workspace}}/TodoItems.Api/Dockerfile
          if-no-files-found: error

  push_docker_image:
    if: inputs.buildConfiguration != ''
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      dockerTag: ${{ steps.createTag.outputs.dockerTag }}
    env:
      REGISTRY: ghcr.io
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    needs: [build, dockerfile_artifact, determine_variables]
    steps:
      - uses: actions/download-artifact@v8
        with:
            name: todoItemsApi
            path: ${{github.workspace}}/api
            
      - uses: actions/download-artifact@v8
        with:
            name: dockerFile
            path: ${{github.workspace}}/dockerFile
            
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create docker tag
        id: createTag
        run: |
          $lowercaseRepo = "${{ github.repository }}".ToLower()
          $dockerTag="${{ env.REGISTRY }}/$lowercaseRepo`:${{ github.sha }}"
          echo "dockerTag=$dockerTag" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: docker/build-push-action@v7
        if: inputs.buildConfiguration != ''
        with:
          context: ${{ github.workspace }}/api
          file: ${{github.workspace}}/dockerFile/Dockerfile
          push: true
          tags: ${{ steps.createTag.outputs.dockerTag }}
      - uses: docker/build-push-action@v7
        if: inputs.buildConfiguration == ''
        with:
          context: ${{ github.workspace }}/api
          file: ${{github.workspace}}/dockerFile/Dockerfile
          push: false
          tags: ${{ steps.createTag.outputs.dockerTag }}

  # Deploys the hub, the spokes and the web app (see Deployment/main.bicep).
  create_env:
    needs: [determine_names, build, push_docker_image]
    uses: ./.github/workflows/create_env.yml
    with:
      region: ${{ vars.AZURE_REGION }}
      template: /artifacts/bicep/main.bicep
      resourceGroupPrefix: ${{ needs.determine_names.outputs.resourceGroupPrefix }}
      additionalParameters: |
        applicationname: todoitems
        dockerImageNameAndTag: ${{needs.push_docker_image.outputs.dockerTag}}
    secrets: inherit

  deploy_db:
    needs: [build, create_env]
    uses: ./.github/workflows/deploy_db.yml
    with:
      sqlServerFQDN: ${{needs.create_env.outputs.sqlServerFQDN}}
      databaseName: ${{needs.create_env.outputs.databaseName}}
    secrets: inherit

  verify_gateway:
    needs: [create_env, deploy_db]
    uses: ./.github/workflows/verify_gateway.yml
    with:
      gatewayUrl: ${{needs.create_env.outputs.gatewayUrl}}
      webAppUrl: ${{needs.create_env.outputs.webAppUrl}}

  smoketests:
    needs: [create_env, verify_gateway]
    uses: ./.github/workflows/smoketests.yml
    with:
      webAppUrl: ${{needs.create_env.outputs.gatewayUrl}}

  # Always cleans up, also after a failed run, so nothing keeps costing money.
  # Not when nothing was deployed (push/schedule), and not when 'keepEnvironment' was ticked.
  delete_env:
    if: ${{ always() && needs.determine_names.result == 'success' && needs.create_env.result != 'skipped' && !inputs.keepEnvironment }}
    needs: [determine_names, create_env, smoketests]
    uses: ./.github/workflows/delete_env.yml
    with:
      resourceGroupPrefix: ${{ needs.determine_names.outputs.resourceGroupPrefix }}
    secrets: inherit
