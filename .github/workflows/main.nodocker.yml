name: Build TodoItems No Docker
on:
  schedule:
    - cron:  '0 0 * * 3'
  push:
    paths-ignore:
      - .azuredevops/**
      - .devcontainer/**
      - .vscode/**
      - .github/dependabot.yml
  workflow_dispatch:
    inputs:
      buildConfiguration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
        - Debug
        - Release
      keepEnvironment:
        description: 'Keep the Azure resources after the run, also when it fails (for debugging)'
        required: true
        default: false
        type: boolean

defaults:
  run:
    shell: pwsh
jobs:
  determine_variables_build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      buildConfiguration: ${{ steps.setupVars.outputs.buildConfiguration }}
    steps:
    - name: Setup variables
      id: setupVars
      run: |
        if("${{inputs.buildConfiguration}}"){
          echo "buildConfiguration=${{inputs.buildConfiguration}}" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
        }
        else{
          echo "buildConfiguration=Release" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
        }

  determine_names:
    uses: ./.github/workflows/determine_names.yml

  build:
    needs: [determine_variables_build]
    uses: ./.github/workflows/build.yml
    with:
      buildConfiguration: ${{needs.determine_variables_build.outputs.buildConfiguration}}
    secrets: inherit

  # Deploys the hub, the spokes and the web app (see Deployment/main.bicep).
  # Only on a manual run (inputs are empty on a push or schedule).
  create_env:
    if: inputs.buildConfiguration != ''
    needs: [determine_names, build]
    uses: ./.github/workflows/create_env.yml
    with:
      region: ${{ vars.AZURE_REGION }}
      template: /artifacts/bicep/main.bicep
      resourceGroupPrefix: ${{ needs.determine_names.outputs.resourceGroupPrefix }}
      additionalParameters: |
        applicationname: todoitems
    secrets: inherit

  deploy_app:
    needs: [build, create_env]
    runs-on: ubuntu-latest
    environment: AzureDeploy
    permissions:
      id-token: write
      contents: read
      deployments: write
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: todoItemsApi
          path: ${{github.workspace}}/artifacts/api
      - uses: Azure/login@v3
        name: Azure Login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: Compress-Archive -Path ${{github.workspace}}/artifacts/api/* -DestinationPath ${{github.workspace}}/artifacts/api/api.zip
      # The code is deployed through the SCM (Kudu) site, which is closed by default (the web app is private).
      # For the length of the deployment this runner gets its own allow rule, removed again afterwards.
      - uses: Azure/cli@v3
        name: Azure Deploy WebApp
        with:
          inlineScript: |
             rg='${{ needs.create_env.outputs.appResourceGroup }}'
             app='${{ needs.create_env.outputs.webAppName }}'

             runnerIp=$(curl -s https://api.ipify.org)
             echo "Runner IP address: $runnerIp"
             az webapp config access-restriction add --resource-group "$rg" --name "$app" --scm-site true --rule-name runner --action Allow --ip-address "$runnerIp/32" --priority 100 --output none
             trap 'az webapp config access-restriction remove --resource-group "$rg" --name "$app" --scm-site true --rule-name runner --output none' EXIT

             # A new rule takes a moment to apply: wait until the SCM site no longer answers 403.
             scm=$(az webapp show --resource-group "$rg" --name "$app" --query "hostNameSslStates[?hostType=='Repository'].name | [0]" -o tsv)
             for i in $(seq 1 18); do
               code=$(curl -s -o /dev/null -w '%{http_code}' "https://$scm/api/deployments" || true)
               echo "Attempt $i: https://$scm returned $code"
               if [ "$code" != "403" ]; then break; fi
               sleep 10
             done

             az webapp deploy --src-path ${{github.workspace}}/artifacts/api/api.zip --name "$app" --resource-group "$rg" --type zip
             az webapp config set --startup-file="dotnet TodoItems.Api.dll" --name "$app" --resource-group "$rg"

  deploy_db:
    needs: [build, create_env]
    uses: ./.github/workflows/deploy_db.yml
    with:
      sqlServerFQDN: ${{needs.create_env.outputs.sqlServerFQDN}}
      databaseName: ${{needs.create_env.outputs.databaseName}}
    secrets: inherit

  verify_gateway:
    needs: [create_env, deploy_app, deploy_db]
    uses: ./.github/workflows/verify_gateway.yml
    with:
      gatewayUrl: ${{needs.create_env.outputs.gatewayUrl}}
      webAppUrl: ${{needs.create_env.outputs.webAppUrl}}

  smoketests:
    needs: [create_env, verify_gateway]
    uses: ./.github/workflows/smoketests.yml
    with:
      webAppUrl: ${{needs.create_env.outputs.gatewayUrl}}

  # Always cleans up, also after a failed run, so nothing keeps costing money.
  # Not when nothing was deployed (push/schedule), and not when 'keepEnvironment' was ticked.
  delete_env:
    if: ${{ always() && needs.determine_names.result == 'success' && needs.create_env.result != 'skipped' && !inputs.keepEnvironment }}
    needs: [determine_names, create_env, smoketests]
    uses: ./.github/workflows/delete_env.yml
    with:
      resourceGroupPrefix: ${{ needs.determine_names.outputs.resourceGroupPrefix }}
    secrets: inherit
