on:
  workflow_call:
    inputs:
      resourceGroupPrefix:
        type: string
        required: true
        description: Unique name of the instance. Every resource group of the instance is tagged with it by main.bicep.
defaults:
  run:
    shell: pwsh
jobs:
  delete_env:
    permissions:
      id-token: write
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: AzureRemove
    steps:
      - uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Also used to clean up after a failed run: only the resource groups that were created are found.
      # The instance is one resource group, named <prefix>-app by main.bicep. It may not exist (the deployment
      # can fail before it is created), so check first.
      - uses: Azure/cli@v3
        with:
          inlineScript: |
            rg='${{ inputs.resourceGroupPrefix }}-app'
            if [ "$(az group exists --name "$rg")" = "true" ]; then az group delete --name "$rg" --yes --no-wait; fi
