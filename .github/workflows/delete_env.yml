on:
  workflow_call:
    inputs:
      hubResourceGroup:
        type: string
        required: true
        description: Name of the resource group of the hub
      spokesResourceGroup:
        type: string
        required: true
        description: Name of the resource group of the spokes and the web app
defaults:
  run:
    shell: pwsh
jobs:
  delete_env:
    permissions:
      id-token: write
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: AzureRemove
    steps:
      - uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Also used to clean up after a failed run, so a resource group may not exist (yet): skip those.
      # The spokes are deleted first, and waited for: they contain a private endpoint that registers its
      # record in the private DNS zone of the hub, and the peerings refer to the hub.
      - uses: Azure/cli@v3
        with:
          inlineScript: |
            if [ "$(az group exists --name '${{ inputs.spokesResourceGroup }}')" = "true" ]; then
              az group delete --name '${{ inputs.spokesResourceGroup }}' --yes
            fi
            if [ "$(az group exists --name '${{ inputs.hubResourceGroup }}')" = "true" ]; then
              az group delete --name '${{ inputs.hubResourceGroup }}' --yes --no-wait
            fi
