on:
  workflow_call:
    inputs:
      resourceGroupPrefix:
        type: string
        required: true
        description: Unique name of the instance. Every resource group of the instance is tagged with it by main.bicep.
defaults:
  run:
    shell: pwsh
jobs:
  delete_env:
    permissions:
      id-token: write
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: AzureRemove
    steps:
      - uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Also used to clean up after a failed run: only the resource groups that were created are found.
      # The resource groups of an instance are found by their tag, so a new spoke needs no change here.
      # The spokes are deleted first, and waited for: they contain a private endpoint that registers its
      # record in the private DNS zone of the hub, and the peerings refer to the hub.
      - uses: Azure/cli@v3
        with:
          inlineScript: |
            prefix='${{ inputs.resourceGroupPrefix }}'
            spokes=$(az group list --query "[?tags.instance=='$prefix' && tags.role=='spoke'].name" -o tsv)
            hubs=$(az group list --query "[?tags.instance=='$prefix' && tags.role=='hub'].name" -o tsv)
            # A resource that is connected to an Azure Monitor private link scope cannot be deleted: disconnect
            # the connected resources (Application Insights in a spoke, the workspace in the hub) first.
            sub=$(az account show --query id -o tsv)
            for hub in $hubs; do
              for scope in $(az resource list --resource-group "$hub" --resource-type Microsoft.Insights/privateLinkScopes --query "[].name" -o tsv); do
                url="https://management.azure.com/subscriptions/$sub/resourceGroups/$hub/providers/Microsoft.Insights/privateLinkScopes/$scope/scopedResources"
                for connection in $(az rest --method get --url "$url?api-version=2021-09-01" --query "value[].name" -o tsv); do
                  az rest --method delete --url "$url/$connection?api-version=2021-09-01" --output none
                done
                for i in $(seq 1 30); do
                  left=$(az rest --method get --url "$url?api-version=2021-09-01" --query "length(value)" -o tsv)
                  if [ "$left" = "0" ]; then break; fi
                  sleep 10
                done
              done
            done
            for rg in $spokes; do az group delete --name "$rg" --yes --no-wait; done
            for rg in $spokes; do az group wait --name "$rg" --deleted; done
            for rg in $hubs; do az group delete --name "$rg" --yes --no-wait; done
