on:
  workflow_call:
    inputs:
      resourceGroupName:
        type: string
        required: true
        description: Name of the resource group of the instance.
defaults:
  run:
    shell: pwsh
jobs:
  delete_env:
    permissions:
      id-token: write
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: AzureRemove
    steps:
      - uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Also used to clean up after a failed run: the resource group may not exist if the run failed early.
      # The instance is one resource group. It may not exist (the deployment
      # can fail before it is created), so check first.
      - uses: Azure/cli@v3
        with:
          inlineScript: |
            rg='${{ inputs.resourceGroupName }}'
            if [ "$(az group exists --name "$rg")" = "true" ]; then az group delete --name "$rg" --yes --no-wait; fi
