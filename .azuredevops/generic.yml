parameters:
- name: buildConfiguration
  type: string
  default: 'Release'
- name: postBuildSteps
  type: stepList
  default: []
- name: bicepTemplate
  type: string
  default: main.bicep
- name: bicepAdditionalParameters
  type: string
  default: ''
- name: keepEnvironment
  type: boolean
  default: false

resources:
  containers:
  - container: mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    env:
      ACCEPT_EULA: Y
      #SA_PASSWORD defined in Build stage
      SA_PASSWORD: $(SA_PASSWORD)
      MSSQL_PID: Developer
    ports:
      - 1433:1433
    options: --name mssql

stages:
- stage: Build
  dependsOn: []
  jobs:
  - template: build.yml
    parameters:
      postBuildSteps: ${{parameters.postBuildSteps}}
      buildConfiguration: ${{parameters.buildConfiguration}}
      serviceContainerName: mssql

#Only on a manual run. The environment is deployed by Deployment/main.bicep: hub, spokes and web app.
- ${{ if eq(variables['Build.Reason'], 'Manual') }}:
  - stage: Deploy
    dependsOn: [Build]
    jobs:
    - template: create_env.yml
      parameters:
        template: ${{parameters.bicepTemplate}}
        additionalParameters: ${{parameters.bicepAdditionalParameters}}
    #bicepAdditionalParameters are only passed for Docker
    #https://stackoverflow.com/questions/60098737/checking-for-null-object-type-parameter-in-azure-yaml
    - ${{if not(parameters.bicepAdditionalParameters)}}:
      - template: deploy.nodocker.yml
    - template: deploy.sql.yml
    - template: verify_gateway.yml
      parameters:
        ${{if not(parameters.bicepAdditionalParameters)}}:
          dependsOn: [Create_Env, Deploy_DB, Deploy_App]
        ${{else }}:
          dependsOn: [Create_Env, Deploy_DB]
    - template: smoketests.yml
      parameters:
        dependsOn: [Create_Env, Verify_Gateway]

  #Always cleans up, also after a failed deployment, so nothing keeps costing money.
  #Not when 'keepEnvironment' was ticked (for debugging).
  - ${{ if not(parameters.keepEnvironment) }}:
    - stage: Delete
      dependsOn: [Deploy]
      condition: succeededOrFailed()
      jobs:
      - deployment: Delete
        environment: todoItems-teardown
        variables:
          - name: resourceGroupPrefix
            value: $[ stageDependencies.Deploy.Determine_Names.outputs['DetermineNames.resourceGroupPrefix'] ]
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              #The resourcegroups of the instance are found by their tag (set by main.bicep), so a new spoke needs no
              #change here. After a failed deployment only the resourcegroups that were created are found.
              #The spokes are deleted first, and waited for: they contain a private endpoint that registers its
              #record in the private DNS zone of the hub, and the peerings refer to the hub.
              - task: AzureCLI@2
                displayName: Delete resourcegroups
                inputs:
                  azureSubscription: 'Azure'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    prefix='$(resourceGroupPrefix)'
                    if [ -z "$prefix" ]; then echo "No instance name known, nothing to delete."; exit 0; fi
                    spokes=$(az group list --query "[?tags.instance=='$prefix' && tags.role=='spoke'].name" -o tsv)
                    hubs=$(az group list --query "[?tags.instance=='$prefix' && tags.role=='hub'].name" -o tsv)
                    # A resource that is connected to an Azure Monitor private link scope cannot be deleted: disconnect
                    # the connected resources (Application Insights in a spoke, the workspace in the hub) first.
                    sub=$(az account show --query id -o tsv)
                    for hub in $hubs; do
                      for scope in $(az resource list --resource-group "$hub" --resource-type Microsoft.Insights/privateLinkScopes --query "[].name" -o tsv); do
                        url="https://management.azure.com/subscriptions/$sub/resourceGroups/$hub/providers/Microsoft.Insights/privateLinkScopes/$scope/scopedResources"
                        for connection in $(az rest --method get --url "$url?api-version=2021-09-01" --query "value[].name" -o tsv); do
                          az rest --method delete --url "$url/$connection?api-version=2021-09-01" --output none
                        done
                        for i in $(seq 1 30); do
                          left=$(az rest --method get --url "$url?api-version=2021-09-01" --query "length(value)" -o tsv)
                          if [ "$left" = "0" ]; then break; fi
                          sleep 10
                        done
                      done
                    done
                    for rg in $spokes; do az group delete --name "$rg" --yes --no-wait; done
                    for rg in $spokes; do az group wait --name "$rg" --deleted; done
                    for rg in $hubs; do az group delete --name "$rg" --yes --no-wait; done
