parameters:
- name: buildConfiguration
  type: string
  default: 'Release'
- name: postBuildSteps
  type: stepList
  default: []
- name: bicepTemplate
  type: string
  default: main.bicep
- name: bicepAdditionalParameters
  type: string
  default: ''

resources:
  containers:
  - container: mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    env:
      ACCEPT_EULA: Y
      #SA_PASSWORD defined in Build stage
      SA_PASSWORD: $(SA_PASSWORD)
      MSSQL_PID: Developer
    ports:
      - 1433:1433
    options: --name mssql

stages:
- stage: Build
  dependsOn: []
  jobs:
  - template: build.yml
    parameters:
      postBuildSteps: ${{parameters.postBuildSteps}}
      buildConfiguration: ${{parameters.buildConfiguration}}
      serviceContainerName: mssql

#Only on a manual run. The environment is deployed by Deployment/main.bicep: hub, spokes and web app.
- ${{ if eq(variables['Build.Reason'], 'Manual') }}:
  - stage: Deploy
    dependsOn: [Build]
    jobs:
    - template: create_env.yml
      parameters:
        template: ${{parameters.bicepTemplate}}
        additionalParameters: ${{parameters.bicepAdditionalParameters}}
    #bicepAdditionalParameters are only passed for Docker
    #https://stackoverflow.com/questions/60098737/checking-for-null-object-type-parameter-in-azure-yaml
    - ${{if not(parameters.bicepAdditionalParameters)}}:
      - template: deploy.nodocker.yml
    - template: deploy.sql.yml
    - template: verify_gateway.yml
      parameters:
        ${{if not(parameters.bicepAdditionalParameters)}}:
          dependsOn: [Create_Env, Deploy_DB, Deploy_App]
        ${{else }}:
          dependsOn: [Create_Env, Deploy_DB]
    - template: smoketests.yml
      parameters:
        dependsOn: [Create_Env, Verify_Gateway]

  #Always cleans up, also after a failed deployment, so nothing keeps costing money.
  - stage: Delete
    dependsOn: [Deploy]
    condition: succeededOrFailed()
    jobs:
    - deployment: Delete
      environment: todoItems-teardown
      variables:
        - name: resourceGroupPrefix
          value: $[ stageDependencies.Deploy.Determine_Names.outputs['DetermineNames.resourceGroupPrefix'] ]
      strategy:
        runOnce:
          deploy:
            steps:
            - download: none
            #Remove first the spokes, then the hub.
            - task: AzureCLI@2
              displayName: Delete resourcegroups
              inputs:
                azureSubscription: 'Azure'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  prefix='$(resourceGroupPrefix)'
                  if [ -z "$prefix" ]; then echo "No instance name known, nothing to delete."; exit 0; fi
                  spokes=$(az group list --query "[?tags.instance=='$prefix' && tags.role=='spoke'].name" -o tsv)
                  hubs=$(az group list --query "[?tags.instance=='$prefix' && tags.role=='hub'].name" -o tsv)
                  # The VNet flow logs live in the Network Watcher resource group of the subscription, not in the resource
                  # groups of this instance: they are not deleted with those, so delete them first (by name, fl-<prefix>-...).
                  location=$(az group list --query "[?tags.instance=='$prefix'] | [0].location" -o tsv)
                  if [ -n "$location" ]; then
                    for flowlog in $(az network watcher flow-log list --location "$location" --query "[?starts_with(name,'fl-$prefix-')].name" -o tsv); do
                      az network watcher flow-log delete --location "$location" --name "$flowlog"
                    done
                  fi
                  for rg in $spokes; do az group delete --name "$rg" --yes --no-wait; done
                  for rg in $spokes; do az group wait --name "$rg" --deleted; done
                  for rg in $hubs; do az group delete --name "$rg" --yes --no-wait; done
