parameters:
- name: template
  type: string
  default: main.bicep
- name: additionalParameters
  type: string
  default: ''

jobs:
#Seperate job for generating the names of the resourcegroups.
#In case the deployment fails, the Create_Env job can be executed again and the same resourcegroups are used as in the previous attempt.
- job: Determine_Names
  steps:
  - checkout: none
  - powershell: |
      $instanceId = Get-Random -Minimum 10000000000 -Maximum 99999999999
      Write-Host "##vso[task.setvariable variable=hubResourceGroup;isoutput=true]todoItems-$instanceId-hub"
      Write-Host "##vso[task.setvariable variable=spokesResourceGroup;isoutput=true]todoItems-$instanceId"
    name: DetermineNames
    displayName: Determine names of the resourcegroups

#Deploys the hub, the spokes and the web app (see Deployment/main.bicep).
#The template runs at subscription scope and creates the resourcegroups itself.
- job: Create_Env
  dependsOn: [Determine_Names]
  variables:
  - group: AzureSecrets
  - name: hubResourceGroup
    value: $[ dependencies.Determine_Names.outputs['DetermineNames.hubResourceGroup'] ]
  - name: spokesResourceGroup
    value: $[ dependencies.Determine_Names.outputs['DetermineNames.spokesResourceGroup'] ]
  steps:
  - checkout: none
  - download: current
    artifact: infraCode
    displayName: Download Bicep files
  - task: AzureResourceManagerTemplateDeployment@3
    inputs:
      deploymentScope: 'Subscription'
      azureResourceManagerConnection: 'Azure'
      subscriptionId: $(subscriptionId)
      location: '$(azure_region)'
      templateLocation: 'Linked artifact'
      csmFile: '$(Pipeline.Workspace)/infraCode/${{ parameters.template }}'
      overrideParameters: '-location $(azure_region) -hubResourceGroupName $(hubResourceGroup) -spokesResourceGroupName $(spokesResourceGroup) -applicationname todoitems -sqlAdministratorLoginUser $(todoItemsSqlAdminUser) -sqlAdministratorLoginPassword $(todoItemsSqlAdminpassword) ${{ parameters.additionalParameters }}'
      deploymentMode: 'Incremental'
      deploymentOutputs: deploymentOutputs
  - bash: |
        echo "##vso[task.setvariable variable=appServiceAppUrl;isOutput=true]$(echo $DEPLOYMENT_OUTPUTS | jq -r '.webAppUrl.value')"
        echo "##vso[task.setvariable variable=appServiceAppName;isOutput=true]$(echo $DEPLOYMENT_OUTPUTS | jq -r '.webAppName.value')"
        echo "##vso[task.setvariable variable=gatewayUrl;isOutput=true]$(echo $DEPLOYMENT_OUTPUTS | jq -r '.gatewayUrl.value')"
        echo "##vso[task.setvariable variable=sqlServerFQDN;isOutput=true]$(echo $DEPLOYMENT_OUTPUTS | jq -r '.sqlServerFQDN.value')"
        echo "##vso[task.setvariable variable=databaseName;isOutput=true]$(echo $DEPLOYMENT_OUTPUTS | jq -r '.databaseName.value')"
    name: SaveDeploymentOutputs
    displayName: Save deployment outputs into variables
    env:
      DEPLOYMENT_OUTPUTS: $(deploymentOutputs)
