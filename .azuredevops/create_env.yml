parameters:
- name: template
  type: string
  default: main.bicep
- name: additionalParameters
  type: string
  default: ''

jobs:
#Seperate job for generating the unique name of the instance.
#In case the deployment fails, the Create_Env job can be executed again and the same resourcegroup is used as in the previous attempt.
- job: Determine_Names
  steps:
  - checkout: none
  - powershell: |
      $instanceId = Get-Random -Minimum 10000000000 -Maximum 99999999999
      Write-Host "##vso[task.setvariable variable=resourceGroupName;isoutput=true]todoItems-$instanceId"
    name: DetermineNames
    displayName: Determine unique name of the instance

#Deploys the network and the web app (see Deployment/main.bicep).
#The resourcegroup is created first, the template is deployed into that resourcegroup.
- job: Create_Env
  dependsOn: [Determine_Names]
  variables:
  - group: AzureSecrets
  - name: resourceGroupName
    value: $[ dependencies.Determine_Names.outputs['DetermineNames.resourceGroupName'] ]
  steps:
  - checkout: none
  - download: current
    artifact: infraCode
    displayName: Download Bicep files
  #Creating the resourcegroup again (a re-run of a failed job) is no problem.
  - task: AzureCLI@2
    displayName: Create resourcegroup
    inputs:
      azureSubscription: 'Azure'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: az group create --location '$(azure_region)' --name '$(resourceGroupName)' --output none
  - task: AzureResourceManagerTemplateDeployment@3
    inputs:
      deploymentScope: 'Resource Group'
      azureResourceManagerConnection: 'Azure'
      subscriptionId: $(subscriptionId)
      action: 'Create Or Update Resource Group'
      resourceGroupName: $(resourceGroupName)
      location: '$(azure_region)'
      templateLocation: 'Linked artifact'
      csmFile: '$(Pipeline.Workspace)/infraCode/${{ parameters.template }}'
      overrideParameters: '-sqlAdministratorLoginUser $(todoItemsSqlAdminUser) -sqlAdministratorLoginPassword $(todoItemsSqlAdminpassword) ${{ parameters.additionalParameters }}'
      deploymentMode: 'Incremental'
      deploymentOutputs: deploymentOutputs
  #Every output of main.bicep becomes an output variable with the same name: webAppUrl, webAppName, gatewayUrl,
  #sqlServerName, sqlServerFQDN and databaseName. A new output of the template needs no change here.
  - bash: |
        echo "$DEPLOYMENT_OUTPUTS" | jq -r 'to_entries[] | "##vso[task.setvariable variable=\(.key);isOutput=true]\(.value.value)"'
    name: SaveDeploymentOutputs
    displayName: Save deployment outputs into variables
    env:
      DEPLOYMENT_OUTPUTS: $(deploymentOutputs)
