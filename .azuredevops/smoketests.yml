parameters:
- name: dependsOn
  type: object

jobs:
- job: SmokeTests
  pool:
    vmImage: ubuntu-latest
  ${{ if parameters.dependsOn }}:
    dependsOn: ${{parameters.dependsOn}}
  variables:
  #The web app is private: the tests run against the Application Gateway.
  - name: gatewayUrl
    value: $[ dependencies.Create_Env.outputs['SaveDeploymentOutputs.gatewayUrl'] ]
  steps:
  - checkout: none
  - download: current
    artifact: smoketests
    displayName: Download smoketests
  - script: docker run --rm -v $(Pipeline.Workspace)/smoketests:/workdir jetbrains/intellij-http-client:latest test.http -V host=$(gatewayUrl)
    displayName: Run IntelliJ HTTP Client tests
