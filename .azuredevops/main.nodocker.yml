trigger:
  batch: true
  branches:
    include:
    - main
  paths:
    exclude:
    - .github/**
    - .devcontainer/**
    - .vscode/**

schedules:
- cron: "0 0 * * 3"
  always: true
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-latest

parameters:
- name: keepEnvironment
  displayName: Keep the Azure resources after the run, also when it fails (for debugging)
  type: boolean
  default: false

extends:
   template: generic.yml
   parameters:
     bicepTemplate: main.bicep
     keepEnvironment: ${{ parameters.keepEnvironment }}
     postBuildSteps: 
       - task: PublishPipelineArtifact@1
         displayName: Publish pipeline artifact 'todoItemsApi'
         inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/todoItemsApi'
          artifact: 'todoItemsApi'
          publishLocation: 'pipeline'
